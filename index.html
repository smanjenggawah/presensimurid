<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Presensi Murid - SMAN Jenggawah</title>

  <!-- PWA Manifest & Ikon -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">

  <!-- Warna Status Bar & Mode Layar Penuh -->
  <meta name="theme-color" content="#0d6efd">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Presensi Murid">

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background-color: #f4f6f9;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    /* Banner Tombol Instal Android */
    #installBanner {
      display: none;
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 420px;
      background: #0d6efd;
      color: #ffffff;
      padding: 12px 16px;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      z-index: 9999;
    }
    #installBanner .info {
      font-size: 0.9rem;
      line-height: 1.3;
    }
    #installBanner .actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
    #btnInstallApp {
      background: #ffffff;
      color: #0d6efd;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
    }
    #btnCloseInstall {
      background: transparent;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.5);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <iframe
    src="https://script.google.com/macros/s/AKfycbz5fAxA3usE9EK-z22O1PjAcbXNEi91UOWzKq8H1-NMggcK9MAxzsyGXk6iDMh2F229/exec"
    allow="geolocation; camera"
    allowfullscreen>
  </iframe>

  <!-- Banner Instalasi Otomatis untuk Android -->
  <div id="installBanner">
    <div class="info">
      <strong>Instal Presensi Murid</strong><br>
      Pasang di layar utama HP agar lebih cepat.
    </div>
    <div class="actions">
      <button id="btnInstallApp">Instal</button>
      <button id="btnCloseInstall" aria-label="Tutup">✕</button>
    </div>
  </div>

  <script>
    // Registrasi Service Worker agar memenuhi syarat PWA Android
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    // Tangkap event instalasi Chrome Android & tampilkan tombol Instal
    let deferredPrompt;
    const banner = document.getElementById('installBanner');
    const btnInstall = document.getElementById('btnInstallApp');
    const btnClose = document.getElementById('btnCloseInstall');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      banner.style.display = 'flex';
    });

    btnInstall.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        banner.style.display = 'none';
      }
      deferredPrompt = null;
    });

    btnClose.addEventListener('click', () => {
      banner.style.display = 'none';
    });

    window.addEventListener('appinstalled', () => {
      banner.style.display = 'none';
    });
  </script>
</body>
</html>
